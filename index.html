<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b15"><title>Etho Racing 3D</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#070b15;color:white;font-family:system-ui;touch-action:none}canvas{display:block}.hud{position:fixed;z-index:2;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 8px #000}.brand{font-size:25px;font-weight:1000;letter-spacing:1px}.brand span{color:#2ce9ff}.stats{display:flex;gap:8px;margin-top:10px}.stat{background:#071426d9;border:1px solid #53eaff66;border-radius:12px;padding:7px 11px}.stat small{display:block;color:#aac3da;font-size:10px}.stat b{font-size:19px}#overlay{position:fixed;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#03081799}.card{max-width:420px;text-align:center;background:linear-gradient(145deg,#14253bee,#050a17f5);border:1px solid #2ce9ff99;border-radius:24px;padding:27px 22px;box-shadow:0 20px 70px #0009}.card h1{font-size:42px;line-height:1;margin:10px 0;font-style:italic}.card h1 span{color:#ffc857}.card p{font-size:14px;color:#c5d7eb;line-height:1.5}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,#24e5ff,#a0f8ff);font-weight:900;font-size:16px;color:#00131b}.kicker{color:#2ce9ff;font-size:11px;letter-spacing:3px;font-weight:bold}.note{font-size:11px!important;color:#8fa8c5!important}.controls{position:fixed;z-index:3;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:61px;height:59px;border-radius:17px;border:1px solid #65eaff99;background:#09182bdd;color:white;font-size:25px;font-weight:bold;touch-action:none}#pause{display:none;position:fixed;z-index:4;right:14px;top:126px;padding:9px 12px;border-radius:10px;background:#09182ddd;border:1px solid #ffffff66;color:white}.hint{position:fixed;z-index:2;bottom:88px;left:0;right:0;text-align:center;font-size:11px;color:#e1faffaa;pointer-events:none}
</style></head><body><div id="game"></div><div class="hud"><div class="brand">ETHO <span>RACING</span> <small style="font-size:10px">3D</small></div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0000</b></div><div class="stat"><small>SPEED</small><b><span id="speed">0</span><small style="display:inline"> km/h</small></b></div><div class="stat"><small>BEST</small><b id="best">0000</b></div></div></div><button id="pause">Ⅱ Pause</button><div class="hint">Steer ◀ ▶ • Avoid traffic</div><div class="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pad"><button class="ctrl" id="brake">▼</button><button class="ctrl" id="boost">▲</button></div></div>
<div id="overlay"><div class="card"><div class="kicker">WELCOME TO THE GRID</div><h1>ETHO <span>RACING</span></h1><p>Drive a car through a 3D highway, dodge traffic, build your score, and beat your best!</p><button class="primary" id="start">START RACING ▶</button><p class="note">Android browser • Internet required to load the 3D engine</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const overlay=document.getElementById('overlay');if(!window.THREE){overlay.querySelector('p').textContent='3D engine did not load. Check your internet and reload.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ab1cf);scene.fog=new THREE.Fog(0x8ab1cf,50,180);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,350);camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x29364b,2));const sun=new THREE.DirectionalLight(0xfff0d5,2.5);sun.position.set(-7,15,8);sun.castShadow=true;scene.add(sun);
const material=(c,r=.5,m=.15)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const roadMat=material(0x252b36,.9),white=material(0xf3fbff),grass=material(0x2c684d),tire=material(0x101319,.9),glass=material(0x14283b,.2,.4);
const road=new THREE.Mesh(new THREE.PlaneGeometry(14,260),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-80;road.receiveShadow=true;scene.add(road);const field=new THREE.Mesh(new THREE.PlaneGeometry(250,300),grass);field.rotation.x=-Math.PI/2;field.position.set(0,-.08,-90);scene.add(field);
const stripes=[];for(let z=-210;z<20;z+=10)for(let x of [-2.3,2.3]){let s=new THREE.Mesh(new THREE.BoxGeometry(.12,.03,4.5),white);s.position.set(x,.02,z);scene.add(s);stripes.push(s)}for(let x of [-7.1,7.1]){let e=new THREE.Mesh(new THREE.BoxGeometry(.2,.1,260),white);e.position.set(x,.03,-80);scene.add(e)}
function box(g,w,h,d,mat,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}
function car(color){let g=new THREE.Group(),body=material(color,.22,.55),rim=material(0xbcd7e8,.25,.7);box(g,1.55,.42,2.8,body,0,.55,0);box(g,1.13,.53,1.3,body,0,.96,-.24);box(g,1,.32,.88,glass,0,1.02,-.25);for(let x of [-.82,.82])for(let z of [-.9,.9]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.18,14),tire);w.rotation.z=Math.PI/2;w.position.set(x,.31,z);g.add(w);let r=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.19,12),rim);r.rotation.z=Math.PI/2;r.position.set(x,.31,z);g.add(r)}let lamp=material(0xd9fbff,.2),tail=material(0xff214b,.2);box(g,.4,.1,.05,lamp,-.45,.63,-1.43);box(g,.4,.1,.05,lamp,.45,.63,-1.43);box(g,.4,.1,.05,tail,-.45,.62,1.43);box(g,.4,.1,.05,tail,.45,.62,1.43);scene.add(g);return g}
const player=car(0x12d8ee);player.position.set(0,0,3);const traffic=[],palette=[0xff4f70,0xffb938,0x8d75ff,0xf4f5ff,0x4ee08a];function spawn(z){let c=car(palette[Math.floor(Math.random()*palette.length)]);c.position.set([-4.3,0,4.3][Math.floor(Math.random()*3)],0,z);c.rotation.y=Math.PI;c.scale.set(.9,.9,.9);traffic.push(c)}for(let i=0;i<5;i++)spawn(-35-i*30);
for(let side of [-1,1])for(let i=0;i<22;i++){let h=5+Math.random()*17,w=3+Math.random()*5,d=4+Math.random()*8,b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material([0x43556c,0x5a6b80,0x303f58][i%3],.8));b.position.set(side*(13+Math.random()*18),h/2,-i*14-10);scene.add(b)}
let running=false,paused=false,score=0,speed=65,px=0,last=0,spawnTimer=0,best=Number(localStorage.getItem('ethoRacingBest')||0),keys={left:false,right:false,boost:false,brake:false};document.getElementById('best').textContent=String(best).padStart(4,'0');
function start(){score=0;speed=65;px=0;running=true;paused=false;overlay.style.display='none';document.getElementById('pause').style.display='block';traffic.forEach((c,i)=>{c.position.set([-4.3,0,4.3][i%3],0,-35-i*31)});player.position.x=0}
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause'};
function end(){running=false;document.getElementById('pause').style.display='none';if(score>best){best=Math.floor(score);localStorage.setItem('ethoRacingBest',best)}document.getElementById('best').textContent=String(best).padStart(4,'0');overlay.style.display='flex';overlay.querySelector('.kicker').textContent='RACE FINISHED';overlay.querySelector('h1').innerHTML='CRASH <span>DETECTED</span>';overlay.querySelector('p').textContent='Score '+Math.floor(score)+' • Best '+best+'. Ready for another run?';document.getElementById('start').textContent='RACE AGAIN ↻'}
for(let [id,key] of [['left','left'],['right','right'],['boost','boost'],['brake','brake']]){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[key]=true};for(let ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false})}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.boost=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.boost=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});
let tx=null;renderer.domElement.addEventListener('touchstart',e=>{tx=e.touches[0]?.clientX},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(tx===null)return;let dx=e.touches[0].clientX-tx;if(Math.abs(dx)>12){keys.left=dx<0;keys.right=dx>0}},{passive:true});renderer.domElement.addEventListener('touchend',()=>{tx=null;keys.left=keys.right=false},{passive:true});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))}addEventListener('resize',resize);
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000||0,.04);last=t;if(running&&!paused){speed=Math.max(25,Math.min(185,speed+(keys.boost?48:keys.brake?-75:8)*dt));let move=speed/65*dt*24;score+=move;px=Math.max(-5.2,Math.min(5.2,px+((keys.right?1:0)-(keys.left?1:0))*dt*8));player.position.x+=(px-player.position.x)*.18;player.rotation.z+=((((keys.left?1:0)-(keys.right?1:0))*.1)-player.rotation.z)*.15;stripes.forEach(s=>{s.position.z+=move;if(s.position.z>12)s.position.z-=220});spawnTimer+=dt;if(spawnTimer>Math.max(.55,1.5-speed/200)){spawnTimer=0;spawn(-130)}traffic.forEach(c=>{c.position.z+=move*(.8+speed/220);if(c.position.z>12){c.position.z=-100-Math.random()*70;c.position.x=[-4.3,0,4.3][Math.floor(Math.random()*3)]}if(Math.abs(c.position.z-player.position.z)<2.1&&Math.abs(c.position.x-player.position.x)<1.45)end()});camera.position.x+=(player.position.x*.3-camera.position.x)*.05;camera.lookAt(player.position.x*.18,1,-7);document.getElementById('score').textContent=String(Math.floor(score)).padStart(4,'0');document.getElementById('speed').textContent=Math.floor(speed)}renderer.render(scene,camera)}requestAnimationFrame(loop)
})();
</script></body></html>
